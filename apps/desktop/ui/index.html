<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>KOBA EDIT</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d10;
      }

      /* Splash markup lives in index.html so the window paints branded before
         the React bundle and terrain preview finish loading. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #0b0d10;
        opacity: 1;
        transition: opacity 380ms ease;
      }

      #boot-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      #boot-splash .splash-art {
        position: absolute;
        inset: 0;
        background: #0b0d10 url("/koba-hero.webp") center 38% / cover no-repeat;
        opacity: 0.62;
        filter: saturate(0.92) contrast(1.02);
        animation: splash-drift 9s cubic-bezier(0.22, 0.61, 0.36, 1) both;
      }

      @keyframes splash-drift {
        from {
          transform: scale(1.14) translateY(1.6%);
          opacity: 0.32;
        }
        to {
          transform: scale(1.04) translateY(0);
          opacity: 0.62;
        }
      }

      #boot-splash .splash-veil {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            115% 85% at 50% 42%,
            rgba(11, 13, 16, 0.12) 0%,
            rgba(11, 13, 16, 0.72) 62%,
            #0b0d10 100%
          ),
          linear-gradient(
            180deg,
            rgba(11, 13, 16, 0.5) 0%,
            rgba(11, 13, 16, 0.05) 32%,
            rgba(11, 13, 16, 0.92) 100%
          );
      }

      #boot-splash .splash-inner {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }

      #boot-splash img {
        width: min(420px, 62vw);
        height: auto;
        display: block;
        filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.55));
        animation: splash-reveal 760ms cubic-bezier(0.16, 0.84, 0.3, 1) both;
      }

      @keyframes splash-reveal {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.955);
          filter: blur(7px) drop-shadow(0 8px 18px rgba(0, 0, 0, 0.4));
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0) drop-shadow(0 18px 40px rgba(0, 0, 0, 0.55));
        }
      }

      #boot-splash .splash-tag {
        margin: 0;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11px;
        font-weight: 500;
        line-height: 1.4;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: rgba(224, 232, 241, 0.62);
        animation: splash-tag 620ms 260ms cubic-bezier(0.16, 0.84, 0.3, 1) both;
      }

      @keyframes splash-tag {
        from {
          opacity: 0;
          letter-spacing: 0.55em;
        }
        to {
          opacity: 1;
          letter-spacing: 0.34em;
        }
      }

      #boot-splash .splash-bar {
        width: 168px;
        height: 2px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.12);
        opacity: 0;
        animation: splash-bar-in 420ms 380ms ease forwards;
      }

      @keyframes splash-bar-in {
        to {
          opacity: 1;
        }
      }

      #boot-splash .splash-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, rgba(217, 43, 43, 0), #d92b2b 55%, #ff6a4d);
        animation: splash-sweep 1.15s ease-in-out infinite;
      }

      @keyframes splash-sweep {
        0% {
          transform: translateX(-105%);
        }
        100% {
          transform: translateX(265%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash .splash-bar::after {
          animation: none;
          width: 100%;
        }

        #boot-splash .splash-art,
        #boot-splash img,
        #boot-splash .splash-tag,
        #boot-splash .splash-bar {
          animation: none;
        }

        #boot-splash .splash-bar {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-label="Loading KOBA EDIT">
      <div class="splash-art"></div>
      <div class="splash-veil"></div>
      <div class="splash-inner">
        <img src="/koba-wordmark.png" alt="KOBA EDIT" />
        <p class="splash-tag">Offline map &amp; monument studio</p>
        <span class="splash-bar"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
