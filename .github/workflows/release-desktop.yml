name: build-release

# Builds every desktop bundle in the cloud: .AppImage/.deb/.rpm on Linux,
# .msi/.exe on Windows. Desktop only.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux bundles
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux bundling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf rpm build-essential curl wget file libxdo-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/src-tauri -> target"
          shared-key: linux-desktop

      - run: npm ci
      - run: npm run check:assets
      - run: npm run typecheck
      - run: npm test --workspace @koba/studio-ui
      - run: npm run build

      - name: Bundle AppImage, deb and rpm
        working-directory: apps/src-tauri
        run: npx tauri build --bundles appimage,deb,rpm

      - uses: actions/upload-artifact@v4
        with:
          name: koba-edit-linux
          if-no-files-found: error
          path: |
            apps/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/src-tauri/target/release/bundle/deb/*.deb
            apps/src-tauri/target/release/bundle/rpm/*.rpm

  windows:
    name: Windows bundles
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/src-tauri -> target"
          shared-key: windows-desktop

      - run: npm ci
      - run: npm run check:assets
      - run: npm run typecheck
      - run: npm test --workspace @koba/studio-ui
      - run: npm run build

      - name: Bundle MSI and NSIS installers
        working-directory: apps/src-tauri
        run: npx tauri build --bundles msi,nsis

      - uses: actions/upload-artifact@v4
        with:
          name: koba-edit-windows
          if-no-files-found: error
          path: |
            apps/src-tauri/target/release/bundle/msi/*.msi
            apps/src-tauri/target/release/bundle/nsis/*.exe

  release:
    name: Draft release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/koba-edit-linux/**/*
            artifacts/koba-edit-windows/**/*
