name: build-release

# Builds every desktop bundle in the cloud: .AppImage/.deb/.rpm on Linux,
# .msi/.exe on Windows, and (on demand) the tablet-only iPadOS app on macOS.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_ios:
        description: "Build the iPadOS bundle (needs Apple signing secrets)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux bundles
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux bundling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf rpm build-essential curl wget file libxdo-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
          shared-key: linux-desktop

      - run: npm ci
      - run: npm run check:assets
      - run: npm test --workspace @rust-studio/ui
      - run: npm run build

      - name: Bundle AppImage, deb and rpm
        working-directory: apps/desktop
        run: npx tauri build --bundles appimage,deb,rpm

      - uses: actions/upload-artifact@v4
        with:
          name: koba-edit-linux
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm

  windows:
    name: Windows bundles
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
          shared-key: windows-desktop

      - run: npm ci
      - run: npm run check:assets
      - run: npm test --workspace @rust-studio/ui
      - run: npm run build

      - name: Bundle MSI and NSIS installers
        working-directory: apps/desktop
        run: npx tauri build --bundles msi,nsis

      - uses: actions/upload-artifact@v4
        with:
          name: koba-edit-windows
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  ios:
    name: iPadOS bundle (tablet only)
    # iOS needs macOS and Apple signing, so it is opt-in from workflow_dispatch
    # and never part of the tag release until the APPLE_* secrets exist.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ios }}
    runs-on: macos-14
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
          shared-key: ios-tablet

      - run: npm ci
      - run: npm run build

      - name: Generate the Xcode project
        working-directory: apps/desktop
        run: npx tauri ios init --ci

      - name: Restrict the app to iPadOS only
        run: node scripts/ios-tablet-only.mjs

      - name: Build the tablet app
        working-directory: apps/desktop
        run: npx tauri ios build --export-method app-store

      - uses: actions/upload-artifact@v4
        with:
          name: koba-edit-ipados
          if-no-files-found: warn
          path: apps/desktop/src-tauri/gen/apple/build/**/*.ipa

  release:
    name: Draft release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/koba-edit-linux/**/*
            artifacts/koba-edit-windows/**/*
