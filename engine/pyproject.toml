[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koba-engine"
version = "1.6.0"
description = "Offline geometry, WorldSerialization, terrain, CUI and asset-index engine for KOBA Studios."
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
    # sketch.py reconstructs sketches on numpy arrays: palette classification,
    # box-blur Gaussians and the 16-bit height grid.
    "numpy>=1.26",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
fast-lz4 = [
    "lz4>=4.3",
]
bundles = [
    "UnityPy>=1.20",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
koba-engine = "koba_engine.cli:main"
rust-studio-ingest = "koba_engine.cli:main"
koba-engine-serve = "koba_engine.__main__:serve"

[tool.setuptools.packages.find]
include = ["koba_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
